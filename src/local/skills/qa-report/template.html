<!doctype html>
<!-- qa-report template: 2-pane evidence report. The build step in SKILL.md replaces the QA_DATA marker below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA report</title>
<style>
:root { --ink:#0f172a; --paper:#fafaf9; --card:#ffffff; --muted:#475569; --line:#e2e8f0; --code:#f1f5f9;
  --ok:#166534; --okbg:#dcfce7; --warn:#92400e; --warnbg:#fef3c7; --bad:#991b1b; --badbg:#fee2e2; --link:#1d4ed8;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 Inter, "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif; color:var(--ink); background:var(--paper); }
a { color:var(--link); }
a:focus-visible, .row:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
.app { display:flex; align-items:flex-start; }
.left { width:60%; padding:24px; }
.right { width:40%; position:sticky; top:0; height:100vh; overflow:auto; padding:24px; background:var(--card); border-left:1px solid var(--line); }
h1 { font-size:24px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 8px; }
h2 { font-size:16px; line-height:1.25; margin:16px 0 8px; }
.sub, .hint, .meta, .exp { color:var(--muted); font-size:12px; }
.ssot { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
.notes { margin:8px 0; padding-left:20px; font-size:12px; }
.kpis { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; }
.kpi b { display:block; font-size:20px; line-height:1.2; }
.row { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:8px 12px; margin:8px 0; cursor:pointer; }
.row.ok { border-left-color:var(--ok); } .row.bad { border-left-color:var(--bad); }
.row.sel { box-shadow:0 0 0 2px var(--ink); }
.rtop, .cs { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.k, .sha, .pr, .ep, .bv, pre { font-family:var(--mono); }
.k { font-weight:700; }
.links { display:inline-flex; flex-wrap:wrap; gap:8px; font-size:12px; }
.tag { padding:0 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--warnbg); color:var(--warn); }
.tag.ok { background:var(--okbg); color:var(--ok); } .tag.bad { background:var(--badbg); color:var(--bad); }
.w { color:var(--warn); font-size:12px; }
.bv { font-size:12px; color:var(--muted); margin:4px 0 8px; }
.case { border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:8px; padding:8px 12px; margin:12px 0; }
.case.warn { border-left-color:var(--warn); } .case.bad { border-left-color:var(--bad); background:var(--badbg); }
.case .lbl { font-size:12px; font-weight:600; margin-top:8px; }
.ep { font-size:12px; word-break:break-all; }
.seq { margin:4px 0; padding-left:20px; }
.act { font-weight:700; }
.call .ch { font-size:12px; margin-top:8px; } .mth { font-weight:700; margin-right:4px; }
.st { font-weight:700; color:var(--ok); } .st.e { color:var(--bad); }
pre { white-space:pre-wrap; word-break:break-word; background:var(--code); border-radius:8px; padding:8px; font-size:12px; margin:4px 0; max-height:480px; overflow:auto; }
.shot { display:block; max-width:100%; margin-top:8px; border:1px solid var(--line); border-radius:8px; }
@media (max-width:900px) { .app { display:block; } .left, .right { width:100%; position:static; height:auto; border-left:0; } }
</style>
</head>
<body>
<div class="app"><main class="left" id="left"></main><aside class="right" id="right"></aside></div>
<script type="application/json" id="qa-data">/*QA_DATA*/</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('qa-data').textContent);
  var M = D.meta || {}, LK = D.links || {};
  var ORDER = ['pass', 'pass (not moved)', 'fail', 'partial', 'blocked', 'superseded', 'deferred', 'not-run', 'report-only'];
  var ST = D.status || {}, OC = D.outcomes || {};
  var NONE = '<span class="w">[—]</span>';
  var SHOTS = [];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? esc(u) : ''; }
  function cls(v) { return v === 'pass' ? 'ok' : v === 'fail' ? 'bad' : 'warn'; }
  function a(href, text, c) { var u = safeUrl(href); return u ? '<a class="' + c + '" href="' + u + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : '<span class="' + c + '">' + esc(text) + '</span>'; }
  function short(r) { return (M.repoAbbr && M.repoAbbr[r]) || String(r || '').split('/').pop(); }
  function calls(c) { return [].concat((c.evidence && c.evidence.reqResp) || []); }
  function shot(c) { var s = c.evidence && c.evidence.shot; return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(s || '')) ? s : ''; }
  // Re-indent JSON text without parsing numbers, so large integer IDs are shown exactly as received.
  function pretty(t) {
    try { JSON.parse(t); } catch (e) { return t; }
    var out = '', ind = 0, i = 0, n = t.length;
    function nl() { return '\n' + new Array(ind + 1).join('  '); }
    while (i < n) {
      var c = t[i];
      if (c === '"') { var j = i + 1; while (j < n && t[j] !== '"') j += t[j] === '\\' ? 2 : 1; out += t.slice(i, j + 1); i = j + 1; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === '{' || c === '[') {
        var k = i + 1; while (k < n && /\s/.test(t[k])) k++;
        if (t[k] === (c === '{' ? '}' : ']')) { out += c + t[k]; i = k + 1; continue; }
        ind++; out += c + nl();
      } else if (c === '}' || c === ']') { ind--; out += nl() + c; }
      else if (c === ',') out += ',' + nl();
      else if (c === ':') out += ': ';
      else out += c;
      i++;
    }
    return out;
  }
  // Row status comes from the build (closeout outcome, or derived); the qa-issue verdict and reason are detail.
  var I = (D.issues || []).map(function (d) { var r = Object.assign({}, d); r.qa = true; return r; })
    .concat((D.nonQa || []).map(function (d) { return { key: d.key, nqStatus: d.status, why: d.reason, cases: [] }; }));
  I.forEach(function (d) {
    var o = OC[d.key] || {};
    d.links = LK[d.key] || {};
    d.status = ST[d.key] || d.nqStatus || d.verdict;
    d.why = o.reason || d.why || d.reason || '';
  });
  function ver(d) {
    if (!d.qa) return '';
    var e = (d.env && typeof d.env === 'object') ? d.env : {}, s = e.versionStart, f = e.versionEnd;
    if (!s && !f) return '<span class="w">version not recorded</span>';
    return 'version ' + esc(s || '?') + ' → ' + esc(f || '?') + (s && f && s !== f ? ' <span class="w">changed during QA</span>' : '');
  }
  function links(d) {
    var L = d.links, cm = L.commits || [], pr = L.prs || [], out = [], miss = [];
    cm.forEach(function (c) { out.push(a(c.url || (c.repo && c.sha ? 'https://github.com/' + c.repo + '/commit/' + c.sha : ''), short(c.repo) + ':' + String(c.sha || '').slice(0, 7), 'sha')); });
    pr.forEach(function (p) { out.push(a(p.url || (p.repo && p.number ? 'https://github.com/' + p.repo + '/pull/' + p.number : ''), (cm.length > 1 || pr.length > 1 ? short(p.repo) : '') + '#' + p.number, 'pr')); });
    if (!safeUrl(L.issue)) miss.push('issue');
    if (!cm.length) miss.push('commit');
    if (!pr.length) miss.push('PR');
    return '<span class="links">' + out.join(' ') + (miss.length ? '<span class="w">no ' + esc(miss.join('/')) + ' link</span>' : '') + '</span>';
  }
  function key(d) { return safeUrl(d.links.issue) ? a(d.links.issue, d.key, 'k') : '<span class="k">' + esc(d.key) + '</span>'; }
  var stats = { calls: 0, shots: 0, missing: 0, noEvidence: 0 }, counts = {};
  I.forEach(function (d) {
    counts[d.status] = (counts[d.status] || 0) + 1;
    (d.cases || []).forEach(function (c) {
      var n = calls(c).length, s = shot(c) ? 1 : 0;
      stats.calls += n; stats.shots += s;
      if (!(c.auth && (c.auth.accountRef || typeof c.auth === 'string'))) stats.missing++;
      ['steps', 'expected', 'actual'].forEach(function (f) { if (c[f] == null || c[f] === '' || (Array.isArray(c[f]) && !c[f].length)) stats.missing++; });
      if (c.status === 'pass' && !n && !s) stats.noEvidence++;
    });
  });
  function tally(d) { var cs = d.cases || [], p = cs.filter(function (c) { return c.status === 'pass'; }).length; return cs.length ? p + '/' + cs.length + ' cases pass' : ''; }
  function caseHtml(c) {
    var n = calls(c), s = shot(c), hi = c.status === 'fail' && /^P[01]$/.test(c.severity || '');
    var k = c.status === 'pass' && (n.length || s) ? '' : hi ? 'bad' : 'warn';
    var h = '<div class="case ' + k + '"><div class="cs">' + esc(c.id) + ' · ' + esc(c.type || '?') + ' · ' + esc(c.severity || '?') +
      ' <span class="tag ' + (c.status === 'pass' ? 'ok' : hi ? 'bad' : 'warn') + '">' + esc(c.status) + '</span></div>';
    if (c.desc) h += '<div>' + esc(c.desc) + '</div>';
    if (c.status === 'pass' && !n.length && !s) h += '<div class="w">pass without evidence</div>';
    var au = c.auth;
    h += '<div class="lbl">account</div><div>' + (au && (au.accountRef || typeof au === 'string') ? esc(typeof au === 'string' ? au : au.accountRef) : NONE) + '</div>';
    h += '<div class="lbl">steps</div>' + (c.steps && c.steps.length ? '<ol class="seq">' + [].concat(c.steps).map(function (x) { return '<li>' + esc(String(x).replace(/^\s*\d+[).]\s*/, '')) + '</li>'; }).join('') + '</ol>' : NONE);
    h += '<div class="lbl">expected / actual</div><div class="exp">' + (c.expected != null && c.expected !== '' ? esc(c.expected) : NONE) + '</div><div class="act">' + (c.actual != null && c.actual !== '' ? esc(c.actual) : NONE) + '</div>';
    n.forEach(function (r) {
      var body = typeof r.respRaw === 'string' ? pretty(r.respRaw) : JSON.stringify(r.respRaw, null, 2);
      h += '<div class="call"><div class="ch ep"><span class="mth">' + esc(r.method) + '</span>' + esc(r.url) + '</div>' + (r.reqBody ? '<pre>' + esc(r.reqBody) + '</pre>' : '') +
        '<div class="ch">response <span class="st' + (Number(r.status) >= 400 ? ' e' : '') + '">' + esc(r.status) + '</span></div><pre>' + esc(body) + '</pre></div>';
    });
    // The image source is set later through the DOM property, never concatenated into markup.
    if (s) { SHOTS.push(s); h += '<img class="shot" alt="' + esc(c.id) + ' screenshot" data-shot="' + (SHOTS.length - 1) + '">'; }
    else if (c.evidence && c.evidence.shotProblem) h += '<div class="w">screenshot ' + esc(c.evidence.shotProblem) + '</div>';
    return h + '</div>';
  }
  function showEv(k) {
    var d = I.filter(function (x) { return x.key === k; })[0];
    if (!d) return;
    SHOTS = [];
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (r) { r.classList.toggle('sel', r.getAttribute('data-k') === k); });
    var t = d.statusTransition, dc = d.deployConfirm, e = (d.env && typeof d.env === 'object') ? d.env : {};
    var h = '<div class="rtop">' + key(d) + ' <span class="tag ' + cls(d.status) + '">' + esc(d.status) + '</span>' + (d.dmSent ? '<span class="w">assignee notified</span>' : '') + '</div>' + links(d);
    if (d.qa) h += '<div class="bv">' + ver(d) + (d.qaLevel ? ' · qa=' + esc(d.qaLevel) : '') + (e.profile ? ' · ' + esc(e.profile) : '') +
      (dc ? '<br>deployed ' + esc(dc.version || '?') + (dc.state ? ' (' + esc(dc.state) + ')' : '') + (dc.provenance ? ' · from ' + esc(dc.provenance) : '') : '') + '</div>';
    if (t) h += '<div class="meta">transition ' + esc(t.from) + ' → ' + esc(t.to) + ' · performed=' + esc(t.performed) + ' · verified=' + esc(t.verified) + (t.reason ? ' · ' + esc(t.reason) : '') + '</div>';
    if (d.trackerComment) h += '<div class="meta">tracker comment ' + esc(d.trackerComment) + '</div>';
    if (d.why) h += '<p class="w">' + esc(d.why) + '</p>';
    if (d.qa) h += '<div class="meta">qa-issue verdict ' + esc(d.verdict) + (d.reason && d.reason !== d.why ? ' · ' + esc(d.reason) : '') + '</div>';
    h += (d.cases && d.cases.length) ? d.cases.map(caseHtml).join('') : '<p class="meta">' + (d.qa ? 'No cases returned.' : 'Not QA\'d in this run.') + '</p>';
    document.getElementById('right').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('#right img[data-shot]'), function (img) { img.src = SHOTS[Number(img.getAttribute('data-shot'))]; });
  }
  var L = '<h1>' + esc(M.title || 'QA report') + '</h1><div class="sub">' +
    esc([M.repo, M.target, M.range, M.status, M.versionStart || M.versionEnd ? 'version ' + (M.versionStart || '?') + ' → ' + (M.versionEnd || '?') : '', M.generatedAt].filter(Boolean).join(' · ')) + '</div>';
  if (M.ssot) L += '<h2>Request</h2><div class="ssot">' + esc(M.ssot) + '</div>';
  L += '<div class="kpis">' + ORDER.concat(Object.keys(counts).filter(function (v) { return ORDER.indexOf(v) < 0; })).filter(function (v) { return counts[v]; })
    .map(function (v) { return '<div class="kpi"><b>' + counts[v] + '</b>' + esc(v) + '</div>'; }).join('') +
    '<div class="kpi"><b>' + stats.calls + '</b>API calls</div><div class="kpi"><b>' + stats.shots + '</b>screenshots</div>' +
    (stats.noEvidence ? '<div class="kpi"><b class="w">' + stats.noEvidence + '</b>pass without evidence</div>' : '') +
    (stats.missing ? '<div class="kpi"><b class="w">' + stats.missing + '</b>missing case fields</div>' : '') +
    (M.masked ? '<div class="kpi"><b>' + esc(M.masked) + '</b>secret values masked</div>' : '') + '</div>';
  if (M.notes && M.notes.length) L += '<ul class="notes">' + [].concat(M.notes).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  L += '<div class="hint">Click a key to open the tracker issue; click a row to show its evidence.</div>';
  L += I.map(function (d) {
    var cs = d.cases || [], n = 0, s = 0;
    cs.forEach(function (c) { n += calls(c).length; s += shot(c) ? 1 : 0; });
    return '<div class="row ' + cls(d.status) + '" tabindex="0" data-k="' + esc(d.key) + '"><div class="rtop">' + key(d) + links(d) + '<span class="tag ' + cls(d.status) + '">' + esc(d.status) + '</span></div>' +
      '<div>' + esc([tally(d), d.why].filter(Boolean).join(' · ')) + '</div>' +
      (d.qa ? '<div class="meta">qa-issue verdict ' + esc(d.verdict) + ' · ' + cs.length + ' cases · ' + n + ' calls · ' + s + ' screenshots · ' + ver(d) + '</div>' : '') + '</div>';
  }).join('');
  function list(title, xs, f) { return xs && xs.length ? '<h2>' + esc(title) + '</h2><ul class="notes">' + xs.map(function (x) { return '<li>' + f(x) + '</li>'; }).join('') + '</ul>' : ''; }
  function prRef(p) { return a(p.url || (p.repo && p.number ? 'https://github.com/' + p.repo + '/pull/' + p.number : ''), short(p.repo) + '#' + p.number, 'pr'); }
  L += list('Mentioned only in a PR body (never transitioned)', D.bodyMentions, function (x) { return esc(x.key) + ' ← ' + prRef(x.pr || {}); });
  L += list('Excluded PRs', D.excludedPrs, function (x) { return prRef(x) + (x.reason ? ' · ' + esc(x.reason) : ''); });
  document.getElementById('left').innerHTML = L;
  Array.prototype.forEach.call(document.querySelectorAll('.row'), function (r) {
    r.addEventListener('click', function () { showEv(r.getAttribute('data-k')); });
    r.addEventListener('keydown', function (e) { if (e.key === 'Enter') showEv(r.getAttribute('data-k')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.row a'), function (x) { x.addEventListener('click', function (e) { e.stopPropagation(); }); });
  var first = I.filter(function (d) { return d.status !== 'pass'; })[0] || I[0];
  if (first) showEv(first.key);
})();
</script>
</body>
</html>
