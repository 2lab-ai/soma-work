<!doctype html>
<!-- qa-report template: 2-pane evidence report. The build step in SKILL.md replaces the QA_DATA marker below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA report</title>
<style>
:root { --ink:#0f172a; --paper:#fafaf9; --card:#ffffff; --muted:#475569; --line:#e2e8f0; --code:#f1f5f9;
  --ok:#166534; --okbg:#dcfce7; --warn:#92400e; --warnbg:#fef3c7; --bad:#991b1b; --badbg:#fee2e2; --link:#1d4ed8;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 Inter, "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif; color:var(--ink); background:var(--paper); }
a { color:var(--link); }
a:focus-visible, .row:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
.app { display:flex; align-items:flex-start; }
.left { width:60%; padding:24px; }
.right { width:40%; position:sticky; top:0; height:100vh; overflow:auto; padding:24px; background:var(--card); border-left:1px solid var(--line); }
h1 { font-size:24px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 8px; }
h2 { font-size:16px; line-height:1.25; margin:16px 0 8px; }
.sub, .hint, .meta, .exp { color:var(--muted); font-size:12px; }
.ssot { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
.notes { margin:8px 0; padding-left:20px; font-size:12px; }
.kpis { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; }
.kpi b { display:block; font-size:20px; line-height:1.2; }
.row { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:8px 12px; margin:8px 0; cursor:pointer; }
.row.ok { border-left-color:var(--ok); } .row.bad { border-left-color:var(--bad); }
.row.sel { box-shadow:0 0 0 2px var(--ink); }
.rtop, .cs { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.k, .sha, .pr, .ep, .bv, pre { font-family:var(--mono); }
.k { font-weight:700; }
.links { display:inline-flex; flex-wrap:wrap; gap:8px; font-size:12px; }
.tag { padding:0 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--warnbg); color:var(--warn); }
.tag.ok { background:var(--okbg); color:var(--ok); } .tag.bad { background:var(--badbg); color:var(--bad); }
.w { color:var(--warn); font-size:12px; }
.bv { font-size:12px; color:var(--muted); margin:4px 0 8px; }
.case { border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:8px; padding:8px 12px; margin:12px 0; }
.case.warn { border-left-color:var(--warn); } .case.bad { border-left-color:var(--bad); background:var(--badbg); }
.case .lbl { font-size:12px; font-weight:600; margin-top:8px; }
.ep { font-size:12px; word-break:break-all; }
.seq { margin:4px 0; padding-left:20px; }
.act { font-weight:700; }
.call .ch { font-size:12px; margin-top:8px; } .mth { font-weight:700; margin-right:4px; }
.st { font-weight:700; color:var(--ok); } .st.e { color:var(--bad); }
pre { white-space:pre-wrap; word-break:break-word; background:var(--code); border-radius:8px; padding:8px; font-size:12px; margin:4px 0; max-height:480px; overflow:auto; }
.pre { background:var(--card); border:1px solid var(--warn); border-radius:8px; padding:8px 12px; margin:8px 0 16px; }
.pre table { border-collapse:collapse; width:100%; font-size:12px; }
.pre th, .pre td { text-align:left; vertical-align:top; padding:4px 8px 4px 0; border-bottom:1px solid var(--line); }
.shot { display:block; max-width:100%; margin-top:8px; border:1px solid var(--line); border-radius:8px; }
/* Summary first: verdict band, conclusion, big numbers, bars, what a person must do. */
#exec { margin:4px 0 20px; }
.vband { font-size:17px; font-weight:700; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-left:8px solid var(--warn); border-radius:8px; margin:12px 0 8px; }
.vband.ok { border-left-color:var(--ok); } .vband.bad { border-left-color:var(--bad); }
.headline { font-size:16px; line-height:1.55; margin:8px 0 12px; }
.bigs { display:flex; flex-wrap:wrap; gap:8px; }
.big { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-width:120px; font-size:12px; color:var(--muted); }
.big b { display:block; font-size:36px; line-height:1.1; color:var(--ink); }
.obar, .cbar { display:flex; overflow:hidden; border-radius:4px; background:var(--line); }
.obar { height:18px; margin:14px 0 4px; } .cbar { height:10px; flex:1; } .obar i, .cbar i { display:block; height:100%; }
i.ok { background:var(--ok); } i.bad { background:var(--bad); } i.warn { background:#d97706; } i.gray { background:#94a3b8; }
.wrow { display:flex; align-items:center; gap:8px; font-size:12px; margin:4px 0; } .wk { width:112px; flex:none; font-weight:600; }
.wbar { flex:1; height:10px; display:flex; background:var(--line); border-radius:4px; overflow:hidden; } .wbar i { display:block; height:100%; } .wn { width:64px; flex:none; color:var(--muted); }
.pret summary { cursor:pointer; font-size:12px; font-weight:600; margin:4px 0; }
.lg { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); }
.lg i { display:inline-block; width:12px; height:10px; margin-right:4px; border-radius:2px; vertical-align:-1px; }
.irows { margin:10px 0; } .irow { display:flex; align-items:center; gap:8px; font-size:12px; margin:4px 0; cursor:pointer; }
.ik { font-family:var(--mono); font-weight:700; width:112px; flex:none; } .in { width:44px; flex:none; text-align:right; color:var(--muted); }
.lbl2 { font-size:12px; font-weight:700; margin-top:12px; } .todo { margin:4px 0 8px; padding-left:20px; font-weight:600; }
@media (max-width:900px) { .app { display:block; } .left, .right { width:100%; position:static; height:auto; border-left:0; } }
</style>
</head>
<body>
<div class="app"><main class="left" id="left"></main><aside class="right" id="right" data-raw="evidence"></aside></div>
<script type="application/json" id="qa-data">/*QA_DATA*/</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('qa-data').textContent);
  var M = D.meta || {}, LK = D.links || {};
  var ORDER = ['pass', 'pass (not moved)', 'fail', 'partial', 'blocked', 'superseded', 'deferred', 'not-run', 'report-only'];
  var ST = D.status || {}, OC = D.outcomes || {};
  var NONE = '<span class="w">[—]</span>';
  var SHOTS = [];
  // meta.lang 'ko' renders the reader-facing words (summary, status tags, hints) in Korean; evidence stays as recorded.
  var KO = M.lang === 'ko';
  var KO_ST = { pass: '통과', 'pass (not moved)': '통과(전환 안 됨)', fail: '실패', partial: '일부만 확인', blocked: '막힘', superseded: '대체됨', deferred: '보류', 'not-run': '실행 안 함', 'report-only': '보고만' };
  function T(en, ko) { return KO ? ko : en; }
  // Own keys only: an input value such as 'toString' must never resolve to an Object.prototype member.
  function own(m, k) { return Object.prototype.hasOwnProperty.call(m, k) ? m[k] : undefined; }
  function lab(v) { return KO && own(KO_ST, v) ? KO_ST[v] : v; }
  function pl(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  var KIND = { account: ['accounts', '계정'], 'test-data': ['test data', '시험 데이터'], 'write-permission': ['write permission', '쓰기 권한'],
    'env-config': ['environment settings', '환경 설정'], 'external-system': ['external systems', '외부 시스템'], observability: ['logs and observability', '로그·관측'],
    'device-locale': ['device and language', '기기·언어'], 'time-control': ['time control', '시간 조작'] };
  function kindName(k) { return own(KIND, k) ? KIND[k][KO ? 1 : 0] : String(k || '?'); }
  var PST = { met: ['met', '있음'], provisionable: ['provisionable', '만들 수 있음'], missing: ['missing', '없음'] };
  var PDC = { provided: ['provided', '제공함'], waived: ['waived', '없이 진행'], skipped: ['skipped', '건너뜀'] };
  function pick(map, v) { return own(map, v) ? map[v][KO ? 1 : 0] : v; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? esc(u) : ''; }
  function cls(v) { return v === 'pass' ? 'ok' : v === 'fail' ? 'bad' : 'warn'; }
  function a(href, text, c) { var u = safeUrl(href); return u ? '<a class="' + c + '" href="' + u + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : '<span class="' + c + '">' + esc(text) + '</span>'; }
  function short(r) { return (M.repoAbbr && M.repoAbbr[r]) || String(r || '').split('/').pop(); }
  function calls(c) { return [].concat((c.evidence && c.evidence.reqResp) || []); }
  function shot(c) { var s = c.evidence && c.evidence.shot; return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(s || '')) ? s : ''; }
  // Re-indent JSON text without parsing numbers, so large integer IDs are shown exactly as received.
  function pretty(t) {
    try { JSON.parse(t); } catch (e) { return t; }
    var out = '', ind = 0, i = 0, n = t.length;
    function nl() { return '\n' + new Array(ind + 1).join('  '); }
    while (i < n) {
      var c = t[i];
      if (c === '"') { var j = i + 1; while (j < n && t[j] !== '"') j += t[j] === '\\' ? 2 : 1; out += t.slice(i, j + 1); i = j + 1; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === '{' || c === '[') {
        var k = i + 1; while (k < n && /\s/.test(t[k])) k++;
        if (t[k] === (c === '{' ? '}' : ']')) { out += c + t[k]; i = k + 1; continue; }
        ind++; out += c + nl();
      } else if (c === '}' || c === ']') { ind--; out += nl() + c; }
      else if (c === ',') out += ',' + nl();
      else if (c === ':') out += ': ';
      else out += c;
      i++;
    }
    return out;
  }
  // Row status comes from the build (closeout outcome, or derived); the qa-issue verdict and reason are detail.
  var I = (D.issues || []).map(function (d) { var r = Object.assign({}, d); r.qa = true; return r; })
    .concat((D.nonQa || []).map(function (d) { return { key: d.key, nqStatus: d.status, why: d.reason, cases: [] }; }));
  I.forEach(function (d) {
    var o = OC[d.key] || {};
    d.links = LK[d.key] || {};
    d.status = ST[d.key] || d.nqStatus || d.verdict;
    d.why = o.reason || d.why || d.reason || '';
  });
  function ver(d) {
    if (!d.qa) return '';
    var e = (d.env && typeof d.env === 'object') ? d.env : {}, s = e.versionStart, f = e.versionEnd;
    if (!s && !f) return '<span class="w">version not recorded</span>';
    return 'version ' + esc(s || '?') + ' → ' + esc(f || '?') + (s && f && s !== f ? ' <span class="w">changed during QA</span>' : '');
  }
  function links(d) {
    var L = d.links, cm = L.commits || [], pr = L.prs || [], out = [], miss = [];
    cm.forEach(function (c) { out.push(a(c.url || (c.repo && c.sha ? 'https://github.com/' + c.repo + '/commit/' + c.sha : ''), short(c.repo) + ':' + String(c.sha || '').slice(0, 7), 'sha')); });
    pr.forEach(function (p) { out.push(a(p.url || (p.repo && p.number ? 'https://github.com/' + p.repo + '/pull/' + p.number : ''), (cm.length > 1 || pr.length > 1 ? short(p.repo) : '') + '#' + p.number, 'pr')); });
    if (!safeUrl(L.issue)) miss.push('issue');
    if (!cm.length) miss.push('commit');
    if (!pr.length) miss.push('PR');
    return '<span class="links" data-raw="links">' + out.join(' ') + (miss.length ? '<span class="w">no ' + esc(miss.join('/')) + ' link</span>' : '') + '</span>';
  }
  function key(d) { return safeUrl(d.links.issue) ? a(d.links.issue, d.key, 'k') : '<span class="k">' + esc(d.key) + '</span>'; }
  var stats = { calls: 0, shots: 0, missing: 0, noEvidence: 0 }, counts = {};
  I.forEach(function (d) {
    counts[d.status] = (counts[d.status] || 0) + 1;
    (d.cases || []).forEach(function (c) {
      var n = calls(c).length, s = shot(c) ? 1 : 0;
      stats.calls += n; stats.shots += s;
      if (!(c.auth && (c.auth.accountRef || typeof c.auth === 'string'))) stats.missing++;
      ['steps', 'expected', 'actual'].forEach(function (f) { if (c[f] == null || c[f] === '' || (Array.isArray(c[f]) && !c[f].length)) stats.missing++; });
      if (c.status === 'pass' && !n && !s) stats.noEvidence++;
    });
  });
  function tally(d) { var cs = d.cases || [], p = cs.filter(function (c) { return c.status === 'pass'; }).length; return cs.length ? p + '/' + cs.length + ' cases pass' : ''; }
  function caseHtml(c) {
    var n = calls(c), s = shot(c), hi = c.status === 'fail' && /^P[01]$/.test(c.severity || '');
    var k = c.status === 'pass' && (n.length || s) ? '' : hi ? 'bad' : 'warn';
    var h = '<div class="case ' + k + '"><div class="cs">' + esc(c.id) + ' · ' + esc(c.type || '?') + ' · ' + esc(c.severity || '?') +
      ' <span class="tag ' + (c.status === 'pass' ? 'ok' : hi ? 'bad' : 'warn') + '">' + esc(lab(c.status)) + '</span></div>';
    if (c.desc) h += '<div>' + esc(c.desc) + '</div>';
    if (c.precondition) h += '<div class="w">precondition ' + esc(c.precondition) + ' — not run for real</div>';
    if (c.evidence && c.evidence.mocked && [].concat(c.evidence.mocked).length) h += '<div class="w">mocked: ' + esc([].concat(c.evidence.mocked).join(', ')) + ' — does not prove server behaviour</div>';
    if (c.status === 'pass' && !n.length && !s) h += '<div class="w">pass without evidence</div>';
    var au = c.auth;
    h += '<div class="lbl">account</div><div>' + (au && (au.accountRef || typeof au === 'string') ? esc(typeof au === 'string' ? au : au.accountRef) : NONE) + '</div>';
    h += '<div class="lbl">steps</div>' + (c.steps && c.steps.length ? '<ol class="seq">' + [].concat(c.steps).map(function (x) { return '<li>' + esc(String(x).replace(/^\s*\d+[).]\s*/, '')) + '</li>'; }).join('') + '</ol>' : NONE);
    h += '<div class="lbl">expected / actual</div><div class="exp">' + (c.expected != null && c.expected !== '' ? esc(c.expected) : NONE) + '</div><div class="act">' + (c.actual != null && c.actual !== '' ? esc(c.actual) : NONE) + '</div>';
    n.forEach(function (r) {
      var body = typeof r.respRaw === 'string' ? pretty(r.respRaw) : JSON.stringify(r.respRaw, null, 2);
      h += '<div class="call"><div class="ch ep"><span class="mth">' + esc(r.method) + '</span>' + esc(r.url) + '</div>' + (r.reqBody ? '<pre>' + esc(r.reqBody) + '</pre>' : '') +
        '<div class="ch">response <span class="st' + (Number(r.status) >= 400 ? ' e' : '') + '">' + esc(r.status) + '</span></div><pre>' + esc(body) + '</pre></div>';
    });
    // The image source is set later through the DOM property, never concatenated into markup.
    if (s) { SHOTS.push(s); h += '<img class="shot" alt="' + esc(c.id) + ' screenshot" data-shot="' + (SHOTS.length - 1) + '">'; }
    else if (c.evidence && c.evidence.shotProblem) h += '<div class="w">screenshot ' + esc(c.evidence.shotProblem) + '</div>';
    return h + '</div>';
  }
  function showEv(k) {
    var d = I.filter(function (x) { return x.key === k; })[0];
    if (!d) return;
    SHOTS = [];
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (r) { r.classList.toggle('sel', r.getAttribute('data-k') === k); });
    var t = d.statusTransition, dc = d.deployConfirm, e = (d.env && typeof d.env === 'object') ? d.env : {};
    var h = '<div class="rtop">' + key(d) + ' <span class="tag ' + cls(d.status) + '">' + esc(lab(d.status)) + '</span>' + (d.dmSent ? '<span class="w">' + T('assignee notified', '담당자에게 알림') + '</span>' : '') + '</div>' + links(d);
    if (d.qa) h += '<div class="bv">' + ver(d) + (d.qaLevel ? ' · qa=' + esc(d.qaLevel) : '') + (e.profile ? ' · ' + esc(e.profile) : '') +
      (dc ? '<br>deployed ' + esc(dc.version || '?') + (dc.state ? ' (' + esc(dc.state) + ')' : '') + (dc.provenance ? ' · from ' + esc(dc.provenance) : '') : '') + '</div>';
    if (t) h += '<div class="meta">transition ' + esc(t.from) + ' → ' + esc(t.to) + ' · performed=' + esc(t.performed) + ' · verified=' + esc(t.verified) + (t.reason ? ' · ' + esc(t.reason) : '') + '</div>';
    if (d.trackerComment) h += '<div class="meta">tracker comment ' + esc(d.trackerComment) + '</div>';
    if (d.why) h += '<p class="w">' + esc(d.why) + '</p>';
    if (d.qa) h += '<div class="meta">qa-issue verdict ' + esc(d.verdict) + (d.reason && d.reason !== d.why ? ' · ' + esc(d.reason) : '') + '</div>';
    h += (d.cases && d.cases.length) ? d.cases.map(caseHtml).join('') : '<p class="meta">' + (d.qa ? T('No cases returned.', '돌려받은 케이스가 없습니다.') : T('Not QA\'d in this run.', '이번 회차에 QA 하지 않았습니다.')) + '</p>';
    document.getElementById('right').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('#right img[data-shot]'), function (img) { img.src = SHOTS[Number(img.getAttribute('data-shot'))]; });
  }
  var L = '<h1>' + esc(M.title || T('QA report', 'QA 리포트')) + '</h1><div class="sub" data-raw="provenance">' +
    esc([M.repo, M.target, M.range, M.status, M.versionStart || M.versionEnd ? 'version ' + (M.versionStart || '?') + ' → ' + (M.versionEnd || '?') : '', M.generatedAt].filter(Boolean).join(' · ')) + '</div>';
  var PRE = [].concat(D.preconditions || []);
  L += summary();
  // Preconditions lead the detail: what was missing, which cases it blocked, and who decided what.
  function decided(p) {
    var d = p.decision;
    if (!d || d === 'pending') return p.status === 'met' || p.status === 'provisionable' ? T('not needed', '필요 없음') : T('waiting for the requester', '요청자 답 대기');
    return esc(pick(PDC, d)) + T(' by ', ' · ') + esc(p.confirmedBy || '?') + (p.confirmRef ? ' · ref ' + esc(p.confirmRef) : '') + (p.confirmedAt ? ' · ' + esc(p.confirmedAt) : '');
  }
  if (PRE.length) {
    var open = PRE.filter(function (p) { return p.status !== 'met' && p.status !== 'provisionable'; });
    L += '<h2>' + T('Preconditions — ' + open.length + ' open of ' + PRE.length, '준비물 — 없는 것 ' + open.length + ' / 전체 ' + PRE.length) + '</h2><div class="pre">' +
      (open.length ? '<p class="w">' + T('QA could not test the cases below for real because these preconditions were missing.', '아래 준비물이 없어서 QA가 해당 케이스를 실제로 시험하지 못했습니다.') + '</p>' : '') +
      (PRE.length > 6 ? '<details class="pret"><summary>' + T('Show the table (' + PRE.length + ' rows)', '표 펼치기 (' + PRE.length + '행)') + '</summary>' : '') +
      '<table><thead><tr><th>' + [T('key', '키'), T('precondition', '준비물'), T('needed', '필요한 것'), T('blocks cases', '막는 케이스'), T('status', '상태'), T('decision', '결정')].join('</th><th>') + '</th></tr></thead><tbody>' +
      PRE.map(function (p) {
        return '<tr><td class="k">' + esc(p.key) + '</td><td data-raw="id">' + esc(p.id) + ' · ' + esc(kindName(p.kind)) + '</td><td>' + esc(p.need || '') + '</td><td data-raw="cases">' +
          esc([].concat(p.cases || []).join(', ')) + '</td><td>' + esc(pick(PST, p.status) || '?') + '</td><td>' + decided(p) + '</td></tr>';
      }).join('') + '</tbody></table>' + (PRE.length > 6 ? '</details>' : '') + '</div>';
  }
  if (M.ssot) L += '<h2>' + T('Request', '요청') + '</h2><div class="ssot" data-raw="request">' + esc(M.ssot) + '</div>';
  L += '<div class="kpis">' + ORDER.concat(Object.keys(counts).filter(function (v) { return ORDER.indexOf(v) < 0; })).filter(function (v) { return counts[v]; })
    .map(function (v) { return '<div class="kpi"><b>' + counts[v] + '</b>' + esc(lab(v)) + '</div>'; }).join('') +
    '<div class="kpi"><b>' + stats.calls + '</b>' + T('API calls', 'API 호출') + '</div><div class="kpi"><b>' + stats.shots + '</b>' + T('screenshots', '스크린샷') + '</div>' +
    (stats.noEvidence ? '<div class="kpi"><b class="w">' + stats.noEvidence + '</b>' + T('pass without evidence', '증거 없는 통과') + '</div>' : '') +
    (stats.missing ? '<div class="kpi"><b class="w">' + stats.missing + '</b>' + T('missing case fields', '빈 케이스 칸') + '</div>' : '') +
    (M.masked ? '<div class="kpi"><b>' + esc(M.masked) + '</b>' + T('secret values masked', '가린 비밀 값') + '</div>' : '') + '</div>';
  if (M.notes && M.notes.length) L += '<ul class="notes" data-raw="notes">' + [].concat(M.notes).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  L += '<div class="hint">' + T('Click a key to open the tracker issue; click a row to show its evidence.', '키를 누르면 트래커 이슈가 열리고, 줄을 누르면 오른쪽에 증거가 나옵니다.') + '</div>';
  L += I.map(function (d) {
    var cs = d.cases || [], n = 0, s = 0;
    cs.forEach(function (c) { n += calls(c).length; s += shot(c) ? 1 : 0; });
    return '<div class="row ' + cls(d.status) + '" tabindex="0" data-k="' + esc(d.key) + '"><div class="rtop">' + key(d) + links(d) + '<span class="tag ' + cls(d.status) + '">' + esc(lab(d.status)) + '</span></div>' +
      '<div>' + esc([tally(d), d.why].filter(Boolean).join(' · ')) + '</div>' +
      (d.qa ? '<div class="meta" data-raw="verdict">qa-issue verdict ' + esc(d.verdict) + ' · ' + cs.length + ' cases · ' + n + ' calls · ' + s + ' screenshots · ' + ver(d) + '</div>' : '') + '</div>';
  }).join('');
  // The first screen: verdict band, one conclusion sentence, big numbers, an outcome bar, one case bar per QA'd issue,
  // and what a person must do. Counts use the same row status as everything below.
  function summary() {
    var n = I.length, pass = 0, fail = 0, ro = 0, failed = [], cp = 0, ct = 0;
    I.forEach(function (d) {
      if (d.status === 'pass') pass++; else if (d.status === 'fail') { fail++; failed.push(d.key); } else if (d.status === 'report-only') ro++;
      (d.cases || []).forEach(function (c) { ct++; if (c.status === 'pass') cp++; });
    });
    var nf = n - pass - fail - ro;
    var openList = PRE.filter(function (p) { return p.status !== 'met' && p.status !== 'provisionable'; }), open = openList.length;
    // Still missing but already decided (waived / provided / skipped) is not a question for anyone any more.
    var waiting = openList.filter(function (p) { return !p.decision || p.decision === 'pending'; }).length;
    var qad = I.filter(function (d) { return d.qa; }).length;
    var tone = fail ? 'bad' : n && pass === n && !open ? 'ok' : 'warn';
    var band = KO ? '이슈 ' + n + '개 중 ' + pass + '개 QA 통과' + (fail ? ' · 실패 ' + fail : '') + (nf ? ' · 끝나지 않음 ' + nf : '') + (ro ? ' · 보고만 ' + ro : '') + (open ? ' · 없는 준비물 ' + open : '')
      : pass + ' of ' + pl(n, 'issue') + ' passed QA' + (fail ? ' · ' + fail + ' failed' : '') + (nf ? ' · ' + nf + ' not finished' : '') + (ro ? ' · ' + ro + ' report only' : '') + (open ? ' · ' + pl(open, 'precondition') + ' open' : '');
    var auto = KO ? '이번 범위의 이슈 ' + n + '개 중 ' + pass + '개 통과, ' + fail + '개 실패' + (ro ? ', ' + ro + '개 보고만' : '') + ', ' + nf + '개는 끝나지 않았습니다.' + (ct ? '' : qad ? ' 돌려받은 케이스 결과가 없습니다.' : ' 케이스는 하나도 실행되지 않았습니다.') + (waiting ? ' 없는 준비물 ' + waiting + '개가 답을 기다립니다.' : '')
      : pl(n, 'issue') + ' in scope: ' + pass + ' passed, ' + fail + ' failed' + (ro ? ', ' + ro + ' report only' : '') + ' and ' + nf + ' not finished.' + (ct ? '' : qad ? ' No case results came back.' : ' No case ran.') + (waiting ? ' ' + pl(waiting, 'open precondition') + (waiting === 1 ? ' awaits' : ' await') + ' an answer.' : '');
    var h = '<section id="exec"><div class="vband ' + tone + '">' + (tone === 'ok' ? '✓ ' : tone === 'bad' ? '✗ ' : '! ') + esc(band) + '</div>' +
      '<p class="headline">' + esc(M.headline || auto) + '</p><div class="bigs">' +
      '<div class="big"><b>' + pass + '/' + n + '</b>' + T('issues passed', '통과한 이슈') + '</div>' +
      '<div class="big"><b>' + fail + '</b>' + T('failed', '실패') + '</div>' +
      '<div class="big"><b>' + nf + '</b>' + T('not finished', '끝나지 않음') + '</div>' +
      (ct ? '<div class="big"><b>' + cp + '/' + ct + '</b>' + T('cases passed', '통과한 케이스') + '</div>' : '') +
      (open ? '<div class="big"><b>' + open + '</b>' + T('preconditions open', '없는 준비물') + '</div>' : '') + '</div>';
    var W = function (k, t) { return Math.round(k * 1000 / t) / 10; };
    var seg = [['ok', pass], ['bad', fail], ['warn', nf], ['gray', ro]].filter(function (x) { return x[1]; });
    if (n) h += '<div class="obar">' + seg.map(function (x) { return '<i class="' + x[0] + '" style="width:' + W(x[1], n) + '%" title="' + x[1] + '"></i>'; }).join('') + '</div>' +
      '<div class="lg"><span><i class="ok"></i>' + T('passed', '통과') + ' ' + pass + '</span><span><i class="bad"></i>' + T('failed', '실패') + ' ' + fail + '</span><span><i class="warn"></i>' + T('not finished', '끝나지 않음') + ' ' + nf + '</span>' + (ro ? '<span><i class="gray"></i>' + T('report only', '보고만') + ' ' + ro + '</span>' : '') + '</div>';
    // What blocks QA: open preconditions by kind, largest first.
    var byKind = Object.create(null);
    openList.forEach(function (p) {
      var kk = p.kind ? String(p.kind) : '?', k = byKind[kk] = byKind[kk] || { n: 0, keys: Object.create(null) };
      k.n++; k.keys[p.key] = 1;
    });
    var kinds = Object.keys(byKind).sort(function (a, b) { return byKind[b].n - byKind[a].n; }), top = kinds.length ? byKind[kinds[0]].n : 0;
    if (kinds.length) h += '<div class="lbl2">' + T('What blocks QA', 'QA를 막고 있는 준비물') + '</div>' + kinds.slice(0, 8).map(function (k) {
      var x = byKind[k], nk = Object.keys(x.keys).length;
      return '<div class="wrow"><span class="wk">' + esc(kindName(k)) + '</span><span class="wbar"><i class="warn" style="width:' + W(x.n, top) + '%"></i></span><span class="in">' + x.n + '</span><span class="wn">' + T(pl(nk, 'issue'), '이슈 ' + nk) + '</span></div>';
    }).join('');
    var qa = I.filter(function (d) { return d.cases && d.cases.length; }), MAX = 12;
    if (qa.length) h += '<div class="lbl2">' + T('Cases per issue', '이슈별 케이스') + '</div><div class="irows">' + qa.slice(0, MAX).map(function (d) {
      var t = d.cases.length, p = 0, f = 0;
      d.cases.forEach(function (c) { if (c.status === 'pass') p++; else if (c.status === 'fail') f++; });
      var bars = [['ok', p], ['bad', f], ['warn', t - p - f]].filter(function (x) { return x[1]; }).map(function (x) { return '<i class="' + x[0] + '" style="width:' + W(x[1], t) + '%"></i>'; }).join('');
      return '<div class="irow" tabindex="0" data-k="' + esc(d.key) + '"><span class="ik">' + esc(d.key) + '</span><span class="cbar">' + bars + '</span><span class="in">' + p + '/' + t + '</span><span class="tag ' + cls(d.status) + '">' + esc(lab(d.status)) + '</span></div>';
    }).join('') + (qa.length > MAX ? '<div class="meta">' + T('+' + (qa.length - MAX) + ' more below', '아래에 ' + (qa.length - MAX) + '개 더') + '</div>' : '') + '</div>';
    var todo = [];
    if (waiting) todo.push(KO ? '없는 준비물 ' + waiting + '개에 답하기 — 아래 표에 무엇이 필요한지 있음' : 'Answer ' + pl(waiting, 'open precondition') + ' — the table below says what each needs');
    if (fail) todo.push(KO ? '실패한 이슈 ' + fail + '개 고치기: ' + failed.join(', ') : 'Fix ' + pl(fail, 'failed issue') + ': ' + failed.join(', '));
    if (todo.length) h += '<div class="lbl2">' + T('What a person must do', '사람이 할 일') + '</div><ol class="todo">' + todo.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    return h + '</section>';
  }
  function list(title, xs, f) { return xs && xs.length ? '<h2>' + esc(title) + '</h2><ul class="notes">' + xs.map(function (x) { return '<li>' + f(x) + '</li>'; }).join('') + '</ul>' : ''; }
  function prRef(p) { return a(p.url || (p.repo && p.number ? 'https://github.com/' + p.repo + '/pull/' + p.number : ''), short(p.repo) + '#' + p.number, 'pr'); }
  L += list('Mentioned only in a PR body (never transitioned)', D.bodyMentions, function (x) { return esc(x.key) + ' ← ' + prRef(x.pr || {}); });
  L += list('Excluded PRs', D.excludedPrs, function (x) { return prRef(x) + (x.reason ? ' · ' + esc(x.reason) : ''); });
  document.getElementById('left').innerHTML = L;
  Array.prototype.forEach.call(document.querySelectorAll('.row, .irow'), function (r) {
    r.addEventListener('click', function () { showEv(r.getAttribute('data-k')); });
    r.addEventListener('keydown', function (e) { if (e.key === 'Enter') showEv(r.getAttribute('data-k')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.row a'), function (x) { x.addEventListener('click', function (e) { e.stopPropagation(); }); });
  var first = I.filter(function (d) { return d.status !== 'pass'; })[0] || I[0];
  if (first) showEv(first.key);
})();
</script>
</body>
</html>
