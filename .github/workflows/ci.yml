name: CI

on:
  push:
    branches:
      - main
      - deploy/prod
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, at the top level so it applies to every job present and future.
# Nothing here publishes: the gate installs, builds, lints, type-checks, tests
# and builds again. A token that could write is a token a compromised
# dependency's install script — running on a persistent host we own — could use,
# so the default token is narrowed to the one scope `actions/checkout` needs.
# The workflows that DO publish (`deploy.yml`, `release-preview.yml`) declare
# `contents: write` themselves; the difference between them and this file should
# be visible in the file, not inferred from the org default.
permissions:
  contents: read

jobs:
  quality-gates:
    # GitHub-hosted: the repository is public, so standard hosted runners are free and unmetered.
    # Until 2026-10-28 this job ran on `[self-hosted, fable-m5max]` — a maintainer's workstation,
    # one job at a time, sharing its CPUs with unrelated builds. On 2026-10-27 the three PR gates
    # asked that one machine for 3,049 runner-minutes in a 1,440-minute day and the queue reached
    # 70 jobs. (It moved there on 2026-08-03 because of an org billing block while the repo was
    # private.) macOS, not Linux: the test suite drives launchd/dscl/service.sh through shims
    # written against the macOS userland, the platform the fleet runs on.
    #
    # The fork guard below is unchanged. On a hosted runner a fork PR can no longer reach a machine
    # we own, but whether forks get this gate is a policy decision for its own change.
    #
    # This repository is public, and `pull_request` fires for fork PRs too. Every
    # step below executes repository code — `npm ci` runs install scripts, the
    # build and test steps run the checked-out sources — so without a guard a
    # fork PR would run attacker-authored code on a persistent machine we own,
    # with its caches, its `~/.npm`, and whatever else lives on that host.
    #
    # The guard is job-level on purpose: it is evaluated before the job is
    # dispatched to a runner, so a fork PR never reaches `actions/checkout` and
    # the untrusted head commit is never fetched onto the host. An allow-list is
    # used rather than `!= 'pull_request'` so that adding a trigger later fails
    # closed (skipped) instead of silently granting the runner to a new event.
    #
    # `pull_request_target` is deliberately NOT used to work around this: it
    # would run with the base repository's secrets and write token, which is the
    # more dangerous half of the same problem. Fork PRs simply do not get this
    # gate; they need a maintainer to run it from a same-repo branch.
    #
    # Kept flat (no continuation line is indented further than the first): a
    # more-indented line in a folded scalar is preserved verbatim, which would
    # put a literal newline inside the expression GitHub has to parse.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    # A hosted macOS runner has 3 cores; test:release is serial (one worker). 30 leaves room for the
    # first runs on it while its real duration is measured.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        # `cache: 'npm'` on a hosted runner: each job starts from an empty ~/.npm. (It was off on the
        # self-hosted Mac, whose ~/.npm persisted and whose 2 GB restore ran at ~5 MB/s.)
        with:
          node-version: '20'
          cache: 'npm'

      # The ui-ux and html skill adapters (designmd_tokens.py) import PyYAML. The self-hosted Mac
      # had it; a hosted image's Homebrew Python refuses pip installs (PEP 668), so use a
      # setup-python interpreter, which comes first on PATH as python3.
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML for the skill adapters' tests
        run: python3 -m pip install pyyaml==6.0.2

      - name: Install dependencies
        run: npm ci

      # The html skill's batch-qa (renderer/batch-qa.mjs) drives Playwright's Chromium headless
      # shell. The self-hosted Mac had it cached; a hosted image does not.
      - name: Install the Playwright headless shell for the html skill tests
        run: npx playwright install --only-shell chromium

      # Workspace packages must be compiled to dist/ before root tsc can
      # resolve `@soma/*` imports (each package.json points main/types at
      # ./dist/...). The Type Check step below relies on these via the
      # workspace symlinks under node_modules/@soma/*.
      - name: Build workspace packages
        run: |
          npm run build:somalib
          npm run build:packages

      - name: Format & Lint (Biome)
        run: npm run check

      - name: Type Check
        run: npx tsc --noEmit

      # NOT `npm test`. That script is a plain `vitest run`: threaded workers
      # sharing a process, and a 5s default timeout. Suites in this repository
      # swap process globals (stdout/stderr sinks, env) and restore them in
      # teardown, so under that configuration a slow teardown does not just fail
      # its own test — it leaks the swap into the next one. PR #191's run
      # 32935347648 is the worked example: install, workspace build, Biome and
      # tsc all passed, then two `src/cli/__tests__/index.test.ts` status-json
      # tests failed — the sink-restoring test hit the 5s timeout, and the test
      # after it parsed concatenated JSON out of sinks the timed-out test never
      # restored. The same file passes 114/114 under the release args, so the
      # red was a property of the runner configuration, not of the diff.
      #
      # `test:release` is the same vitest run with forked, isolated workers and
      # a realistic timeout — the identical deterministic gate the release path
      # uses (`.github/workflows/release-preview.yml`). Using it here means what
      # gates a merge is exactly what gates a release, and a red here is a claim
      # about the code rather than about worker scheduling.
      - name: Test
        run: npm run test:release

      - name: Build
        run: npm run build
