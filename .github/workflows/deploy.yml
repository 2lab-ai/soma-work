name: Deploy

on:
  push:
    branches: [deploy/dev, deploy/prod]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        type: string
      targets:
        description: 'Runner labels to deploy to (comma-separated). Empty = every configured target for the channel. Unknown labels fail the run.'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, fable-m5max]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      runner_labels: ${{ steps.targets.outputs.runner_labels }}
    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.confirm }}" != "deploy" ]]; then
            echo "::error::Confirmation required. Pass confirm='deploy' to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Deployment topology lives OUTSIDE the repo, in Actions repo variables
      # (Settings > Secrets and variables > Actions > Variables), one entry
      # per line in the form  {runner-name}:{target-dir} :
      #   PREVIEW_DEPLOY_TARGETS    — preview channel  (deploy/dev, main dispatch)
      #   PRODUCTION_DEPLOY_TARGETS — production channel (deploy/prod)
      # Entries get neutral job names (t1, t2, ...) so the run list and job graph
      # stay topology-free (step logs do print the resolved entries).
      #
      # A manual run may narrow the set with the `targets` input (comma-separated
      # runner labels). The variable stays the single source of truth: the input
      # can only SELECT from it, never add to it, and a label that is not
      # configured fails the run instead of being ignored — a typo must not turn
      # into "deployed everywhere" or "deployed nowhere" silently.
      #
      # Environment plugins (the private per-host plugin that carries this
      # host's post-deploy QA) are configured per channel too, but as repo
      # SECRETS (Settings > Secrets and variables > Actions > Secrets), because a
      # step's env header prints variable values into the public run log while a
      # secret prints as ***:
      #   PREVIEW_ENV_PLUGINS / PRODUCTION_ENV_PLUGINS, one entry per line,
      #   {runner-label}|{marketplace-name}|{owner/repo}[@{ref}]|{plugin}[,{plugin}...]
      # Each channel reads only its own secret (no fallback between them), and
      # every line must name one of this channel's runner labels (the
      # runner_labels output below, taken before any `targets` narrowing). The
      # Deploy step checks the lines before stopping the service, then merges
      # the lines for its runner into the target's config.json
      # (dist/deploy/apply-env-plugins.js) before the restart.
      #
      # Deploy-workflow sandbox grants (the extra host directories and QA
      # hostnames that post-deploy QA needs inside the requester's sandboxed
      # session) follow the same rules: repo secrets, one per channel, no
      # fallback, every line naming one of this channel's runner labels:
      #   PREVIEW_DEPLOY_SANDBOX / PRODUCTION_DEPLOY_SANDBOX, one entry per line,
      #   {runner-label}|{user}[,{user}...]|[{domain}[,{domain}...]]|[{path}[,{path}...]]
      #   e.g. runner-a|UAPPROVED1|qa.example.test,*.qa.example.test|/srv/qa/lock,/srv/qa/runs
      # Users are Slack user IDs; domains are hostnames or *.hostname (lowercase,
      # no scheme, port, path, or IP literal); paths are absolute and
      # normalized, never / or anything under /tmp. The domain and path fields
      # may be empty, and a runner may appear on several lines (their union).
      # The Deploy step checks the lines before stopping the service, then
      # writes the union for its runner into the target's
      # config.json#deploySandbox (dist/deploy/apply-deploy-sandbox.js) before
      # the restart — or deletes that key when no line names the runner, so
      # removing a line revokes the grant on the next deploy. The daemon applies
      # it only to deploy-workflow turns sent by a listed user: the paths always,
      # the domains only while that user's network allowlist is on.
      - name: Resolve deploy targets
        id: targets
        env:
          RAW: ${{ github.ref_name == 'deploy/prod' && vars.PRODUCTION_DEPLOY_TARGETS || vars.PREVIEW_DEPLOY_TARGETS }}
          GITHUB_ENV_NAME: ${{ github.ref_name == 'deploy/prod' && 'production' || 'development' }}
          DEPLOY_ENV_NAME: ${{ github.ref_name == 'deploy/prod' && 'main' || 'dev' }}
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || '' }}
        run: |
          matrix=$(jq -R -s -c --arg ge "$GITHUB_ENV_NAME" --arg de "$DEPLOY_ENV_NAME" '
            split("\n")
            | map(gsub("^\\s*-\\s*";"") | gsub("^\\s+|\\s+$";""))
            | map(select(length > 0 and (startswith("#") | not)))
            | to_entries
            | map((.value | split(":")) as $p
                | {name: ("t\(.key + 1)"),
                   runner_label: $p[0],
                   target_dir: ($p[1:] | join(":")),
                   github_env: $ge,
                   deploy_env: $de})
            | {include: .}' <<< "$RAW")
          # Every runner label of this channel, BEFORE the `targets` narrowing
          # below: the Deploy step rejects an env-plugin line naming any other
          # label (a typo there would otherwise install nothing anywhere).
          runner_labels=$(jq -r '[.include[].runner_label] | unique | join(",")' <<< "$matrix")
          # Normalize once: drop ALL whitespace (spaces, tabs, newlines) so the
          # emptiness check and the split see the same string.
          SELECT_NORM="$(tr -d '[:space:]' <<< "$SELECT")"
          if [[ -n "$SELECT_NORM" ]]; then
            selected=$(jq -R -c 'split(",") | map(select(length > 0)) | unique' <<< "$SELECT_NORM")
            unknown=$(jq -c --argjson sel "$selected" '[.include[].runner_label] as $known | $sel | map(select(. as $s | ($known | index($s)) == null))' <<< "$matrix")
            if [[ "$(jq 'length' <<< "$unknown")" -ne 0 ]]; then
              echo "::error::Requested targets are not configured for this channel: $(jq -r 'join(",")' <<< "$unknown")"
              exit 1
            fi
            matrix=$(jq -c --argjson sel "$selected" '{include: [.include[] | select(.runner_label as $l | ($sel | index($l)) != null)]}' <<< "$matrix")
            echo "targets narrowed by input to $(jq 'length' <<< "$selected") of the configured set"
          fi
          count=$(jq '.include | length' <<< "$matrix")
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No deploy targets configured for this channel (check repo Actions variables)."
            exit 1
          fi
          echo "targets: $count"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "runner_labels=$runner_labels" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke MCP bin package exports
        run: npm run smoke:mcp-bins

      - name: Smoke package assets
        run: npm run smoke:assets

      - name: Configure git identity
        run: |
          git config user.email "z@2lab.ai"
          git config user.name "Z"

      - name: Version bump & release notes
        run: |
          REF="${{ github.ref_name }}"
          # Normalize deploy branch names to their target refs
          case "$REF" in
            deploy/dev) REF="main" ;;
            deploy/prod) REF="deploy/prod" ;;
          esac
          ./scripts/version-bump.sh "$REF"

      - name: Stage deploy bundle
        run: bash scripts/deploy/stage-bundle.sh

      - name: Smoke deploy bundle
        run: npm run smoke:deploy-bundle

      - name: Pack deploy bundle
        run: tar -czf deploy-bundle.tar.gz -C .deploy-bundle .

      - name: Upload deploy bundle (draft release asset — org artifact quota independent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$TAG" --draft --title "$TAG" --notes "transient deploy bundle (auto-deleted)" --target "${{ github.sha }}" --repo "${{ github.repository }}"
          gh release upload "$TAG" deploy-bundle.tar.gz --repo "${{ github.repository }}"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: prepare
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    timeout-minutes: 15
    environment: ${{ matrix.github_env }}
    strategy:
      fail-fast: false
      # Matrix is resolved by the prepare job from PREVIEW_DEPLOY_TARGETS /
      # PRODUCTION_DEPLOY_TARGETS repo variables ({runner}:{target-dir} lines).
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download deploy bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf bundle && mkdir -p bundle
          gh release download "$TAG" -p deploy-bundle.tar.gz -D bundle --repo "${{ github.repository }}"

      - name: Extract deploy bundle
        run: |
          # Self-hosted runners keep their _work tree between jobs, so a stale
          # bundle/root from an EARLIER deploy survives here. tar extracts on
          # top without removing files that no longer exist in the new bundle,
          # so a deleted workspace (e.g. the dead packages/extensions asset
          # mirror) lingered in bundle/root and was then rsynced back onto the
          # target — breaking `npm ci` with "Missing: @soma/extensions from
          # lock file". Always extract into a clean directory.
          rm -rf bundle/root
          mkdir -p bundle/root
          tar -xzf bundle/deploy-bundle.tar.gz -C bundle/root

      - name: Deploy
        env:
          ENV: ${{ matrix.deploy_env }}
          TARGET: ${{ matrix.target_dir }}
          # Both channel lists, as secrets (the env header shows ***), selected
          # by $ENV in the script — never an `a || b` expression, which would
          # hand a production deploy the preview list whenever the production
          # secret is unset.
          ENV_PLUGINS_PREVIEW: ${{ secrets.PREVIEW_ENV_PLUGINS }}
          ENV_PLUGINS_PRODUCTION: ${{ secrets.PRODUCTION_ENV_PLUGINS }}
          DEPLOY_SANDBOX_PREVIEW: ${{ secrets.PREVIEW_DEPLOY_SANDBOX }}
          DEPLOY_SANDBOX_PRODUCTION: ${{ secrets.PRODUCTION_DEPLOY_SANDBOX }}
          RUNNER_LABEL: ${{ matrix.runner_label }}
          CHANNEL_RUNNER_LABELS: ${{ needs.prepare.outputs.runner_labels }}
        run: |
          cd bundle/root
          echo "::add-mask::$TARGET"
          echo "Deploying target ${{ matrix.name }}..."

          # Clock reading taken BEFORE anything is stopped. The Verify step
          # requires the live process to have started after this instant, which
          # is what deploy run 35184945142 could not tell: `status` reported the
          # PREVIOUS deploy's pid (61554, 4h old) as RUNNING and the job went
          # green while the old bundle kept serving.
          DEPLOY_STARTED=$(date +%s)
          echo "DEPLOY_STARTED=$DEPLOY_STARTED" >> "$GITHUB_ENV"
          echo "Deploy started at epoch $DEPLOY_STARTED"

          # Self-hosted runners launch non-login shells; nvm-installed node
          # is not on PATH until we source nvm.sh. Without this, the
          # `npm ci --omit=dev` and resvg smoke test below would fail with
          # "command not found" on targets using nvm.
          if ! command -v node >/dev/null 2>&1; then
            if [[ -s "$HOME/.nvm/nvm.sh" ]]; then
              # shellcheck disable=SC1091
              source "$HOME/.nvm/nvm.sh"
            fi
            # Final fallback: a specific nvm-installed binary path.
            if ! command -v node >/dev/null 2>&1; then
              NVM_BIN="$(ls -1d "$HOME"/.nvm/versions/node/v*/bin 2>/dev/null | sort -V | tail -1 || true)"
              if [[ -n "$NVM_BIN" ]]; then
                export PATH="$NVM_BIN:$PATH"
              fi
            fi
            # Fallback for runners where node is installed via Homebrew
            # rather than nvm. Apple Silicon: /opt/homebrew, Intel/Linux: /usr/local.
            if ! command -v node >/dev/null 2>&1; then
              for BREW_PREFIX in /opt/homebrew /usr/local; do
                if [[ -x "$BREW_PREFIX/bin/node" ]]; then
                  export PATH="$BREW_PREFIX/bin:$PATH"
                  break
                fi
              done
            fi
          fi
          command -v node >/dev/null 2>&1 || {
            echo "::error::node not found on PATH after nvm/brew fallbacks — cannot deploy."
            exit 1
          }
          command -v npm >/dev/null 2>&1 || {
            echo "::error::npm not found on PATH after nvm/brew fallbacks — cannot deploy."
            exit 1
          }
          echo "Using node: $(node -v) at $(command -v node)"

          # The version the prepare job bumped, as written into the bundle by
          # scripts/version-bump.sh. This is the exact string the daemon prints
          # at startup (src/index.ts: "bot is running! [v<version> (<sha>)]"),
          # so the Verify step can demand THIS version's startup line.
          # `node -p` prints the literal string "undefined" when the file parses
          # but carries no `version` key, and that string would then be passed
          # to verify-restart as if it were a version — a grep for
          # "[vundefined (" that can never match, i.e. a deploy that fails for
          # the wrong reason. Treat it exactly like the missing-file case.
          DEPLOY_VERSION="$(node -p "require('./dist/version.json').version" 2>/dev/null || true)"
          if [[ -z "$DEPLOY_VERSION" || "$DEPLOY_VERSION" == "undefined" || "$DEPLOY_VERSION" == "null" ]]; then
            echo "::error::dist/version.json missing or has no version field in the deploy bundle — the restart cannot be verified."
            exit 1
          fi
          echo "DEPLOY_VERSION=$DEPLOY_VERSION" >> "$GITHUB_ENV"
          echo "Deploying version $DEPLOY_VERSION"

          if [[ "$ENV" == "main" ]]; then
            DEV_SOURCE="/opt/soma-work/dev" \
            LEGACY_ROOT="/Users/dd/app.claude-code-slack-bot" \
            TARGET="$TARGET" \
            node dist/deploy/main-env-bootstrap.js
          fi

          # Environment plugins: the production environment reads only the
          # production list, every other environment only the preview list.
          # Empty = nothing to install (a no-op, not a fallback).
          if [[ "$ENV" == "main" ]]; then
            export ENV_PLUGINS="$ENV_PLUGINS_PRODUCTION"
          else
            export ENV_PLUGINS="$ENV_PLUGINS_PREVIEW"
          fi
          # Deploy-workflow sandbox grants: the same channel selection. Empty =
          # no runner has a grant, which removes one an earlier deploy wrote
          # (still never the other channel's list).
          if [[ "$ENV" == "main" ]]; then
            export DEPLOY_SANDBOX="$DEPLOY_SANDBOX_PRODUCTION"
          else
            export DEPLOY_SANDBOX="$DEPLOY_SANDBOX_PREVIEW"
          fi
          # Validate before anything is stopped: a malformed list or an
          # unreadable config.json fails the deploy while the old service still
          # runs. Same computation as the real apply below, nothing written.
          node dist/deploy/apply-env-plugins.js --check "$TARGET"
          node dist/deploy/apply-deploy-sandbox.js --check "$TARGET"

          # No `|| true`: a stop that leaves the old supervisor alive (failed
          # unload, a second launchd domain, an orphan tree) must fail the
          # deploy here instead of rsyncing a new bundle under a running old
          # process and calling it green.
          bash scripts/service.sh "$ENV" stop
          bash scripts/deploy/sync-bundle.sh "$TARGET" "."
          # This runner's environment plugins go into the target's config.json
          # (plugin.marketplace / plugin.plugins) before install-target.sh
          # restarts the service, so the PluginManager fetches and loads them at
          # startup. Node built-ins only: the target has no node_modules until
          # install-target.sh runs. It prints counts, never names.
          node dist/deploy/apply-env-plugins.js "$TARGET"
          # This runner's deploy-workflow sandbox grant, same rules: set in
          # config.json#deploySandbox, or removed when no line names this
          # runner. Counts only.
          node dist/deploy/apply-deploy-sandbox.js "$TARGET"
          # The restarted daemon must not inherit the plugin lists or the grants.
          unset DEPLOY_SANDBOX DEPLOY_SANDBOX_PREVIEW DEPLOY_SANDBOX_PRODUCTION
          unset ENV_PLUGINS ENV_PLUGINS_PREVIEW ENV_PLUGINS_PRODUCTION RUNNER_LABEL CHANNEL_RUNNER_LABELS
          bash scripts/deploy/install-target.sh "$TARGET" "$ENV" "${{ matrix.name }}"

      - name: Verify
        env:
          ENV: ${{ matrix.deploy_env }}
        run: |
          # The Deploy step's `cd bundle/root` does not persist across steps;
          # scripts/service.sh lives at bundle/root/scripts/service.sh after
          # the Extract step. Without this cd the Verify step would fail with
          # "scripts/service.sh: No such file or directory". See PR #960
          # review (P1 finding #2).
          cd bundle/root
          sleep 3
          # Liveness: a process exists at all.
          bash scripts/service.sh "$ENV" status
          # Identity: that process started during THIS deploy and logged THIS
          # version's startup line. Without it the step is satisfied by any
          # leftover process — run 35184945142 passed on a 4h-old one.
          # 180s: measured on fable-m5max 2026-09-17, the startup line landed
          # 5–8s after the supervisor came up on warm starts but 88s and 129s
          # on two cold ones. Passed explicitly so the budget this job depends
          # on is visible here, not only in the script's default.
          bash scripts/service.sh "$ENV" verify-restart \
            --since "$DEPLOY_STARTED" \
            --version "$DEPLOY_VERSION" \
            --timeout 180

  cleanup-bundle:
    name: Cleanup deploy bundle release
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: [self-hosted, fable-m5max]
    timeout-minutes: 5
    steps:
      - name: Delete draft bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
