name: Deploy

on:
  push:
    branches: [deploy/dev, deploy/prod]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        type: string
      targets:
        description: 'Runner labels to deploy to (comma-separated). Empty = every configured target for the channel. Unknown labels fail the run.'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: [self-hosted, fable-m5max]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.confirm }}" != "deploy" ]]; then
            echo "::error::Confirmation required. Pass confirm='deploy' to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Deployment topology lives OUTSIDE the repo, in Actions repo variables
      # (Settings > Secrets and variables > Actions > Variables), one entry
      # per line in the form  {runner-name}:{target-dir} :
      #   PREVIEW_DEPLOY_TARGETS    — preview channel  (deploy/dev, main dispatch)
      #   PRODUCTION_DEPLOY_TARGETS — production channel (deploy/prod)
      # Entries get neutral job names (t1, t2, ...) so the run list and job graph
      # stay topology-free (step logs do print the resolved entries).
      #
      # A manual run may narrow the set with the `targets` input (comma-separated
      # runner labels). The variable stays the single source of truth: the input
      # can only SELECT from it, never add to it, and a label that is not
      # configured fails the run instead of being ignored — a typo must not turn
      # into "deployed everywhere" or "deployed nowhere" silently.
      - name: Resolve deploy targets
        id: targets
        env:
          RAW: ${{ github.ref_name == 'deploy/prod' && vars.PRODUCTION_DEPLOY_TARGETS || vars.PREVIEW_DEPLOY_TARGETS }}
          GITHUB_ENV_NAME: ${{ github.ref_name == 'deploy/prod' && 'production' || 'development' }}
          DEPLOY_ENV_NAME: ${{ github.ref_name == 'deploy/prod' && 'main' || 'dev' }}
          SELECT: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || '' }}
        run: |
          matrix=$(jq -R -s -c --arg ge "$GITHUB_ENV_NAME" --arg de "$DEPLOY_ENV_NAME" '
            split("\n")
            | map(gsub("^\\s*-\\s*";"") | gsub("^\\s+|\\s+$";""))
            | map(select(length > 0 and (startswith("#") | not)))
            | to_entries
            | map((.value | split(":")) as $p
                | {name: ("t\(.key + 1)"),
                   runner_label: $p[0],
                   target_dir: ($p[1:] | join(":")),
                   github_env: $ge,
                   deploy_env: $de})
            | {include: .}' <<< "$RAW")
          # Normalize once: drop ALL whitespace (spaces, tabs, newlines) so the
          # emptiness check and the split see the same string.
          SELECT_NORM="$(tr -d '[:space:]' <<< "$SELECT")"
          if [[ -n "$SELECT_NORM" ]]; then
            selected=$(jq -R -c 'split(",") | map(select(length > 0)) | unique' <<< "$SELECT_NORM")
            unknown=$(jq -c --argjson sel "$selected" '[.include[].runner_label] as $known | $sel | map(select(. as $s | ($known | index($s)) == null))' <<< "$matrix")
            if [[ "$(jq 'length' <<< "$unknown")" -ne 0 ]]; then
              echo "::error::Requested targets are not configured for this channel: $(jq -r 'join(",")' <<< "$unknown")"
              exit 1
            fi
            matrix=$(jq -c --argjson sel "$selected" '{include: [.include[] | select(.runner_label as $l | ($sel | index($l)) != null)]}' <<< "$matrix")
            echo "targets narrowed by input to $(jq 'length' <<< "$selected") of the configured set"
          fi
          count=$(jq '.include | length' <<< "$matrix")
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No deploy targets configured for this channel (check repo Actions variables)."
            exit 1
          fi
          echo "targets: $count"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke MCP bin package exports
        run: npm run smoke:mcp-bins

      - name: Smoke package assets
        run: npm run smoke:assets

      - name: Configure git identity
        run: |
          git config user.email "z@2lab.ai"
          git config user.name "Z"

      - name: Version bump & release notes
        run: |
          REF="${{ github.ref_name }}"
          # Normalize deploy branch names to their target refs
          case "$REF" in
            deploy/dev) REF="main" ;;
            deploy/prod) REF="deploy/prod" ;;
          esac
          ./scripts/version-bump.sh "$REF"

      - name: Stage deploy bundle
        run: bash scripts/deploy/stage-bundle.sh

      - name: Smoke deploy bundle
        run: npm run smoke:deploy-bundle

      - name: Pack deploy bundle
        run: tar -czf deploy-bundle.tar.gz -C .deploy-bundle .

      - name: Upload deploy bundle (draft release asset — org artifact quota independent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$TAG" --draft --title "$TAG" --notes "transient deploy bundle (auto-deleted)" --target "${{ github.sha }}" --repo "${{ github.repository }}"
          gh release upload "$TAG" deploy-bundle.tar.gz --repo "${{ github.repository }}"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: prepare
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    timeout-minutes: 10
    environment: ${{ matrix.github_env }}
    strategy:
      fail-fast: false
      # Matrix is resolved by the prepare job from PREVIEW_DEPLOY_TARGETS /
      # PRODUCTION_DEPLOY_TARGETS repo variables ({runner}:{target-dir} lines).
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download deploy bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf bundle && mkdir -p bundle
          gh release download "$TAG" -p deploy-bundle.tar.gz -D bundle --repo "${{ github.repository }}"

      - name: Extract deploy bundle
        run: |
          # Self-hosted runners keep their _work tree between jobs, so a stale
          # bundle/root from an EARLIER deploy survives here. tar extracts on
          # top without removing files that no longer exist in the new bundle,
          # so a deleted workspace (e.g. the dead packages/extensions asset
          # mirror) lingered in bundle/root and was then rsynced back onto the
          # target — breaking `npm ci` with "Missing: @soma/extensions from
          # lock file". Always extract into a clean directory.
          rm -rf bundle/root
          mkdir -p bundle/root
          tar -xzf bundle/deploy-bundle.tar.gz -C bundle/root

      - name: Deploy
        env:
          ENV: ${{ matrix.deploy_env }}
          TARGET: ${{ matrix.target_dir }}
        run: |
          cd bundle/root
          echo "::add-mask::$TARGET"
          echo "Deploying target ${{ matrix.name }}..."

          # Self-hosted runners launch non-login shells; nvm-installed node
          # is not on PATH until we source nvm.sh. Without this, the
          # `npm ci --omit=dev` and resvg smoke test below would fail with
          # "command not found" on targets using nvm.
          if ! command -v node >/dev/null 2>&1; then
            if [[ -s "$HOME/.nvm/nvm.sh" ]]; then
              # shellcheck disable=SC1091
              source "$HOME/.nvm/nvm.sh"
            fi
            # Final fallback: a specific nvm-installed binary path.
            if ! command -v node >/dev/null 2>&1; then
              NVM_BIN="$(ls -1d "$HOME"/.nvm/versions/node/v*/bin 2>/dev/null | sort -V | tail -1 || true)"
              if [[ -n "$NVM_BIN" ]]; then
                export PATH="$NVM_BIN:$PATH"
              fi
            fi
            # Fallback for runners where node is installed via Homebrew
            # rather than nvm. Apple Silicon: /opt/homebrew, Intel/Linux: /usr/local.
            if ! command -v node >/dev/null 2>&1; then
              for BREW_PREFIX in /opt/homebrew /usr/local; do
                if [[ -x "$BREW_PREFIX/bin/node" ]]; then
                  export PATH="$BREW_PREFIX/bin:$PATH"
                  break
                fi
              done
            fi
          fi
          command -v node >/dev/null 2>&1 || {
            echo "::error::node not found on PATH after nvm/brew fallbacks — cannot deploy."
            exit 1
          }
          command -v npm >/dev/null 2>&1 || {
            echo "::error::npm not found on PATH after nvm/brew fallbacks — cannot deploy."
            exit 1
          }
          echo "Using node: $(node -v) at $(command -v node)"

          if [[ "$ENV" == "main" ]]; then
            DEV_SOURCE="/opt/soma-work/dev" \
            LEGACY_ROOT="/Users/dd/app.claude-code-slack-bot" \
            TARGET="$TARGET" \
            node dist/deploy/main-env-bootstrap.js
          fi

          bash scripts/service.sh "$ENV" stop || true
          bash scripts/deploy/sync-bundle.sh "$TARGET" "."
          bash scripts/deploy/install-target.sh "$TARGET" "$ENV" "${{ matrix.name }}"

      - name: Verify
        env:
          ENV: ${{ matrix.deploy_env }}
        run: |
          # The Deploy step's `cd bundle/root` does not persist across steps;
          # scripts/service.sh lives at bundle/root/scripts/service.sh after
          # the Extract step. Without this cd the Verify step would fail with
          # "scripts/service.sh: No such file or directory". See PR #960
          # review (P1 finding #2).
          cd bundle/root
          sleep 3
          bash scripts/service.sh "$ENV" status

  cleanup-bundle:
    name: Cleanup deploy bundle release
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: [self-hosted, fable-m5max]
    timeout-minutes: 5
    steps:
      - name: Delete draft bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
